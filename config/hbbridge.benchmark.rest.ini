; Merge into the existing Protheus REST 2.0 configuration.
; Reuse HTTPREST/HTTPURI and the existing TLS, RPO, licensing and PrepareIn keys.
; Keep HTTPJOB in the existing [ONSTART] Jobs list; do not replace other jobs.
; No extra HTTP listener, credential provider or benchmark bearer token is used.

[HTTPSERVER]
Enable=0

[HTTPV11]
Enable=1
Sockets=HTTPREST

[HTTPREST]
Port=4323
URIs=HTTPURI
Security=1
; Preserve this listener's existing TLS configuration and certificate locations.

[HTTPURI]
URL=/rest
Instances=1,1
; Preserve the deployment's existing PrepareIn company/branch settings.

[HTTPJOB]
Main=HTTP_START
Environment=PROTHEUS

[hbBridge]
BenchmarkProtheusURL=https://localhost:4323/rest
BenchmarkProtheusCredentialSection=FWWEBEX_PROTHEUS
BenchmarkAddonModule=examples/hbbridgebenchmarkaddon.hrb
BenchmarkAddonTimeoutSeconds=600
; The existing credential section supplies UserName and Password server-side.
; Do not copy credentials into this public example or browser parameters.
