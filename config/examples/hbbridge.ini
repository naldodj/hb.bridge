; Same settings as hbbridge.json. Relative storage paths start at this file.
[General]
MaxWorkers=64
AddonRoot=../../addons

[Protheus]
Host=0.0.0.0
Port=1512
MaxPayloadBytes=0
MaxWireBytes=0
ReadChunkBytes=65536
TimeoutMs=30000

[NETIO]
Host=0.0.0.0
Port=2941
Root=../../data
Password=
TimeoutMs=0

[Admin]
Host=127.0.0.1
Port=2940
Password=

; Enable deliberately; set separate service/admin secrets locally.
[HTTP]
Enabled=false
Host=127.0.0.1
Port=8080
; Optional ListenBacklog=<positive native integer>; omission uses OS SOMAXCONN.
Password=
TLS=false
Certificate=
PrivateKey=

; Optional process-wide physical reuse; restart after first ODBC use to change.
; driver mode requires the accepted Windows ODBC 3.8 driver/manager combination.
[SQL]
ODBCPooling=off
