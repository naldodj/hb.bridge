; Profile aliases are opaque, case-sensitive keys; driver selection is separate.
; Configure the MSSQL ODBC DSN for the server process before querying it.
[SQL/sqlite_demo]
Driver=sqlite
Database=:memory:

[SQL/mssql/pData]
Driver=mssql
ConnectionString=DSN=pData;Trusted_Connection=Yes;

; Oracle is a future connector: the current driver schema rejects driver=oracle.
