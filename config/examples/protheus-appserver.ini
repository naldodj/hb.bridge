; Merge this section into the INI used by the Protheus AppServer.
; Host is the hbBridge destination, not the AppServer listener or NETIO endpoint.
[hbBridge]
Host=127.0.0.1
Port=1512
TimeoutMs=30000
MaxPayloadBytes=0
MaxWireBytes=0
ReadChunkBytes=65536
; Optional default; each dataset call may select another server profile.
; Examples: sqlite_demo or mssql/pData. No driver is selected implicitly.
SQLProfile=
