; Configure a matching ODBC DSN for the hbBridge process before querying.
[SQL/mssql_demo]
Driver=mssql
DSN=hbBridgeMSSQL
Authentication=integrated
Encrypt=mandatory
TrustServerCertificate=false
; Optional native ODBC timeouts, in integer seconds; omitted uses driver defaults.
; Explicit 0 disables the corresponding timeout; query applies to each statement.
; LoginTimeoutSeconds=5
; QueryTimeoutSeconds=30
